<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a5fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단어코끼리">
<link rel="apple-touch-icon" href="icon-192.png">
<title>임용 단어코끼리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: single phone-width column, ocean-blue ink on cool paper, coral reserved for streak/attention. */
:root{
  --bg:#F2F6FA; --surface:#FFFFFF; --ink:#0F2740; --muted:#5B7089; --line:#DCE5EE;
  --sea:#1668D9; --sea-soft:#E3EEFD; --coral:#E8502A; --ok:#168A5B; --ok-soft:#DDF3E8;
  --bad:#C93A3A; --bad-soft:#FBE3E3; --gold:#C98A00;
  --font-display:'Jua','Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR','Noto Sans',system-ui,sans-serif;
  --font-latin:'Noto Sans','Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1622; --surface:#122233; --ink:#E8F0F8; --muted:#92A6BC; --line:#223850;
    --sea:#5AA2FF; --sea-soft:#17304F; --coral:#FF7F5E; --ok:#4CC38A; --ok-soft:#12362A;
    --bad:#FF7A7A; --bad-soft:#3B1D22; --gold:#F2C14E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1622; --surface:#122233; --ink:#E8F0F8; --muted:#92A6BC; --line:#223850;
  --sea:#5AA2FF; --sea-soft:#17304F; --coral:#FF7F5E; --ok:#4CC38A; --ok-soft:#12362A;
  --bad:#FF7A7A; --bad-soft:#3B1D22; --gold:#F2C14E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-text-size-adjust:100%}
body{min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:16px 16px 104px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.disp{font-family:var(--font-display);font-weight:400}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;min-height:48px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06182B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06182B}}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--sea-soft);color:var(--sea)}
.chip.coral{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:10px;background:var(--sea-soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sea);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.top{display:flex;align-items:center;gap:12px}
.top .bar{flex:1}
.top .count{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:56px;text-align:right}

/* header */
.head{display:flex;align-items:center;justify-content:space-between}
.head h1{font-family:var(--font-display);font-size:26px;font-weight:400}

/* hero */
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--sea-soft),var(--surface));}
.elephant{flex:none;height:auto;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.elephant{animation:none}}
.el-b{fill:var(--sea);stroke:var(--surface);stroke-width:2}
.el-t{stroke:var(--sea);fill:none;stroke-linecap:round}
.hero-art{width:150px;display:flex;justify-content:center;align-items:flex-end;flex:none}
.streak{font-family:var(--font-display);font-size:44px;line-height:1;color:var(--coral);font-variant-numeric:tabular-nums}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.strip div{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.dot.on{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .dot.on{color:#06182B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dot.on{color:#06182B}}
.dot.now{border-color:var(--coral)}
.steps{display:flex;gap:8px}
.step{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.step.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step.cur{border-color:var(--sea);color:var(--sea)}
.big{font-family:var(--font-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}

/* word card */
.wcard{padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-height:340px}
.word{font-family:var(--font-latin);font-weight:700;font-size:38px;line-height:1.1;overflow-wrap:anywhere}
.ipa{font-family:var(--font-latin);color:var(--sea);font-size:18px}
.mean{font-size:22px;font-weight:700}
.ex{font-family:var(--font-latin);font-size:16px;line-height:1.6;padding:12px 14px;border-left:4px solid var(--sea);background:var(--sea-soft);border-radius:0 12px 12px 0}
.ex mark{background:none;color:var(--sea);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.df{font-family:var(--font-latin);font-size:15px;line-height:1.55;padding:10px 12px;border-left:4px solid var(--coral);background:color-mix(in srgb,var(--coral) 10%,transparent);border-radius:0 12px 12px 0}
.df mark{background:none;color:var(--coral);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.veil{filter:blur(9px);user-select:none;cursor:pointer}
.tap-hint{font-size:13px;color:var(--muted)}
.star{color:var(--muted)} .star.on{color:var(--gold);border-color:var(--gold)}

/* quiz */
.q{display:flex;flex-direction:column;gap:14px}
.qprompt{font-size:14px;color:var(--muted);font-weight:700}
.qmain{font-family:var(--font-latin);font-size:30px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.qmain.ko{font-family:var(--font-body);font-size:26px}
.qmain.sent{font-size:19px;font-weight:500;line-height:1.7}
.blank{display:inline-block;min-width:92px;border-bottom:3px solid var(--sea);margin:0 4px;vertical-align:baseline}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:16px;font-weight:500;display:flex;gap:12px;align-items:center;min-height:56px}
.opt b{width:28px;height:28px;border-radius:50%;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;font-size:13px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.inp{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:20px;font-family:var(--font-latin)}
.inp:focus{border-color:var(--sea);outline:none}
.inp.right{border-color:var(--ok);background:var(--ok-soft)}
.inp.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb .v{font-weight:700;font-size:17px}
.fb.ok .v{color:var(--ok)} .fb.bad .v{color:var(--bad)}
.hintline{min-height:20px;color:var(--muted);font-size:14px;font-family:var(--font-latin);letter-spacing:.08em}

/* result */
.ring{width:150px;height:150px;position:relative;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--sea-soft)} .ring .pr{stroke:var(--sea);transition:stroke-dashoffset .6s}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:34px}
.wlist{display:flex;flex-direction:column}
.wlist>div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wlist>div:first-child{border-top:0}
.wlist b{font-family:var(--font-latin)}

/* lists */
details{border-top:1px solid var(--line);padding:2px 0}
details:first-child{border-top:0}
summary{list-style:none;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;cursor:pointer;min-height:48px}
summary::-webkit-details-marker{display:none}
summary b{font-family:var(--font-latin);font-size:17px}
.dbody{display:flex;flex-direction:column;gap:8px;padding:0 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sea-soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--muted);min-height:44px}
.seg button.on{background:var(--surface);color:var(--sea);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stages{display:flex;gap:4px}
.stages i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.stages i.on{background:var(--ok)}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:var(--font-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums;padding:0}
.cal button.e{visibility:hidden}
.cal button.a1{background:var(--sea-soft);border-color:var(--sea);color:var(--sea);font-weight:700}
.cal button.a2{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:700}
:root[data-theme="dark"] .cal button.a2{color:#06182B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cal button.a2{color:#06182B}}
.cal button.now{box-shadow:0 0 0 2px var(--coral)}
.cal button.sel{outline:3px solid var(--ink);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--muted)}
.badge .m{width:40px;height:40px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--font-display);font-size:16px;color:var(--muted)}
.badge.on{color:var(--ink);border-color:var(--gold)}
.badge.on .m{background:var(--gold);color:#fff}
.pbar{display:flex;flex-direction:column;gap:6px}

/* settings */
.toggle{display:flex;gap:8px;flex-wrap:wrap}
.toggle button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;min-height:44px}
.toggle button.on{border-color:var(--sea);background:var(--sea-soft);color:var(--sea)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .v{font-family:var(--font-display);font-size:36px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:80px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:13px}
label.lbl{font-weight:700;font-size:14px}
input[type=date]{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:44px}

/* dict */
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;background:var(--surface);color:var(--ink);min-height:48px}
.search:focus{outline:2px solid var(--sea);border-color:var(--sea)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.fchips button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;min-height:36px}
.fchips button.on{background:var(--sea);border-color:var(--sea);color:#fff}
.st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.st-dot.l{background:var(--sea)}.st-dot.w{background:var(--coral)}.st-dot.m{background:#2e9e6a}
.wk{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.kbd{font-size:12px;color:var(--muted);text-align:center}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
#nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#nav button{border:0;background:none;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);min-height:54px;position:relative}
#nav button.on{color:var(--sea);background:var(--sea-soft)}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav .pill{position:absolute;top:4px;left:calc(50% + 6px);background:var(--coral);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;line-height:18px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:700;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== DATA ===================== */
const CATS={read:'독해 어휘',ling:'영어학 용어',edu:'영어교육 용어',phr:'숙어·구동사',lit:'영미문학 용어',my:'내 단어'};
const CAT_DEFAULT=['read','ling','edu'];
const D=(cat,rows)=>rows.map(r=>({w:r[0],ipa:r[1],pos:r[2],ko:r[3],ex:r[4],cat}));
const WORDS=[].concat(
D('read',[
["ameliorate","/əˈmiːliəreɪt/","v.","개선하다, 완화하다","New subsidies were introduced to {ameliorate} the housing crisis."],
["ubiquitous","/juːˈbɪkwɪtəs/","adj.","어디에나 있는","Smartphones have become {ubiquitous} in modern classrooms."],
["ephemeral","/ɪˈfemərəl/","adj.","덧없는, 순식간의","Fame in the digital age is often {ephemeral}."],
["exacerbate","/ɪɡˈzæsərbeɪt/","v.","악화시키다","Stress can {exacerbate} language anxiety in learners."],
["mitigate","/ˈmɪtɪɡeɪt/","v.","완화하다, 줄이다","Supportive feedback can {mitigate} learner anxiety."],
["pragmatic","/præɡˈmætɪk/","adj.","실용적인","She took a {pragmatic} approach to curriculum design."],
["ambiguous","/æmˈbɪɡjuəs/","adj.","모호한, 애매한","The instructions were {ambiguous}, so students read them differently."],
["meticulous","/məˈtɪkjələs/","adj.","꼼꼼한, 세심한","He kept {meticulous} records of each student's progress."],
["substantiate","/səbˈstænʃieɪt/","v.","입증하다","The author failed to {substantiate} her claims with evidence."],
["corroborate","/kəˈrɑːbəreɪt/","v.","확증하다, 뒷받침하다","Further data {corroborate} the earlier findings."],
["discrepancy","/dɪˈskrepənsi/","n.","불일치, 차이","There was a {discrepancy} between the two reports."],
["inherent","/ɪnˈhɪrənt/","adj.","내재된, 고유한","Some risk is {inherent} in any educational reform."],
["plausible","/ˈplɔːzəbl/","adj.","그럴듯한","That is a {plausible} explanation for the drop in scores."],
["reluctant","/rɪˈlʌktənt/","adj.","꺼리는, 마지못한","Many students are {reluctant} to speak in front of peers."],
["coherent","/koʊˈhɪrənt/","adj.","일관성 있는","A {coherent} essay moves logically from one idea to the next."],
["arbitrary","/ˈɑːrbətreri/","adj.","임의적인","The link between a word's form and its meaning is largely {arbitrary}."],
["scrutinize","/ˈskruːtənaɪz/","v.","면밀히 조사하다","Reviewers {scrutinize} every variable in the experiment."],
["advocate","/ˈædvəkeɪt/","v.","옹호하다, 지지하다","Many scholars {advocate} task-based instruction."],
["disseminate","/dɪˈsemɪneɪt/","v.","퍼뜨리다, 보급하다","Journals {disseminate} new research to teachers."],
["profound","/prəˈfaʊnd/","adj.","깊은, 심오한","Technology has had a {profound} effect on literacy."],
["tenacious","/təˈneɪʃəs/","adj.","끈기 있는, 집요한","A {tenacious} learner keeps practicing despite setbacks."],
["detrimental","/ˌdetrɪˈmentl/","adj.","해로운","Excessive correction can be {detrimental} to motivation."],
["conducive","/kənˈduːsɪv/","adj.","도움이 되는","A relaxed atmosphere is {conducive} to language learning."],
["exemplify","/ɪɡˈzemplɪfaɪ/","v.","예증하다, 전형적으로 보여주다","This case study will {exemplify} the principle."],
["elucidate","/ɪˈluːsɪdeɪt/","v.","명료하게 설명하다","The teacher drew a diagram to {elucidate} the rule."],
["alleviate","/əˈliːvieɪt/","v.","덜어주다, 경감하다","Pair work can {alleviate} students' fear of making mistakes."],
["contentious","/kənˈtenʃəs/","adj.","논쟁적인","Grammar instruction remains a {contentious} issue."],
["incongruous","/ɪnˈkɑːŋɡruəs/","adj.","어울리지 않는","The casual tone seemed {incongruous} in a formal report."],
["paramount","/ˈpærəmaʊnt/","adj.","가장 중요한","Student safety is of {paramount} importance."],
["superfluous","/suːˈpɜːrfluəs/","adj.","불필요한, 여분의","Delete any {superfluous} words from your draft."],
["relinquish","/rɪˈlɪŋkwɪʃ/","v.","포기하다, 내려놓다","Teachers must {relinquish} some control in learner-centered classrooms."],
["skeptical","/ˈskeptɪkl/","adj.","회의적인","Critics remained {skeptical} of the new method."],
["impede","/ɪmˈpiːd/","v.","방해하다","Fear of failure can {impede} progress."],
["foster","/ˈfɔːstər/","v.","촉진하다, 육성하다","Group projects {foster} collaboration."],

    if(snap.exists){const r=snap.data();if(r&&r.json)changed=applyRemote(r);}
    else if(!pristine(S)){SYNC.dirty=true;}
    SYNC.on=true;SYNC.status='ok';SYNC.last=Date.now();
    if(SYNC.dirty&&!pristine(S)){S.ts=Math.max(S.ts||0,Date.now());saveLocal();syncPush();}
    if(changed){ensureToday();if(!['study','quiz','qsetup'].includes(view)){render();toast('다른 기기의 기록을 불러왔어요');}}
    else if(view==='settings')render();
    SYNC.unsub=ref.onSnapshot(sn=>{
      if(!sn.exists||(sn.metadata&&sn.metadata.hasPendingWrites))return;
      const r=sn.data();if(!r||!r.json||!(r.ts>(S.ts||0)))return;
      if(['study','quiz','qsetup'].includes(view)){SYNC.pending=r;return;}
      if(applyRemote(r)){ensureToday();render();toast('다른 기기의 기록을 불러왔어요');}
    },()=>{});
  }catch(e){SYNC.on=false;SYNC.status='err';if(view==='settings')render();}
}

function makePlan(batch){
  const n=S.set.daily, cats=S.set.cats.length?S.set.cats:Object.keys(CATS);
  const hash=t=>{let h=7;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h;};
  const groups=cats.map(c=>{const g=WORDS.filter(w=>w.cat===c&&!S.learned[w.w]);return c==='read'?g.sort((a,b)=>hash(a.w)-hash(b.w)):g;});
  const ids=[];let i=0;
  const wt=cats.map(c=>c==='read'?2:1);
  while(ids.length<n&&groups.some((g,gi)=>g.length>i*wt[gi])){groups.forEach((g,gi)=>{for(let j=0;j<wt[gi];j++){const w=g[i*wt[gi]+j];if(w&&ids.length<n)ids.push(w.w);}});i++;}
  return {date:TODAY(),ids,idx:0,studyDone:false,quizDone:false,batch:batch||1};
}

  const titles={daily:'오늘의 퀴즈',review:'복습 퀴즈',practice:'연습 퀴즈',retry:'틀린 문제 다시 풀기'};
  const T=[['mc','객관식','뜻 ↔ 단어 4지선다'],['short','단답형','뜻을 보고 영단어 쓰기'],['cloze','예문 빈칸 채우기','예문의 빈칸에 알맞은 형태 쓰기'],['def','정의 → 용어 쓰기','정의를 보고 용어 쓰기 (영어학·교육 용어)'],['dcloze','정의 빈칸 채우기','정의 속 핵심어 채우기 (영어학·교육 용어)']];
  return `
  <div class="top"><button class="icon-btn" data-a="back-home" aria-label="뒤로">‹</button><h1 class="disp" style="font-size:24px">${titles[PEND.mode]}</h1></div>
  <div class="card col"><div class="big">${n}문제</div><p class="muted small">문제 유형을 고르세요. 여러 개를 고르면 단어마다 섞어서 출제돼요.</p>
   ${T.map(t=>`<button class="opt ${ty.includes(t[0])?'right':''}" data-a="toggle-type" data-t="${t[0]}" aria-pressed="${ty.includes(t[0])}"><b>${ty.includes(t[0])?'✓':''}</b><span><b style="all:unset;font-weight:700">${t[1]}</b><br><span class="muted small">${t[2]}</span></span></button>`).join('')}
  </div>
  <button class="btn primary block" data-a="start-quiz">퀴즈 시작</button>`;
}

function buildQ(id,types){
  const w=BY[id];
  const okT=types.filter(x=>x==='mc'||x==='short'||(x==='cloze'&&/\{.+?\}/.test(w.ex||''))||((x==='def'||x==='dcloze')&&w.df));
  const t=pick(okT.length?okT:['mc']);
  if(t==='mc'){
    const dir=Math.random()<.5?'en2ko':'ko2en';
    let pool=shuffle(WORDS.filter(x=>x.w!==w.w&&x.ko!==w.ko));
    const sc=x=>(x.pos===w.pos?2:0)+(x.cat===w.cat?1:0);
    pool.sort((a,b)=>sc(b)-sc(a));
    const opts=shuffle([w].concat(pool.slice(0,3)));
    return {id,type:'mc',dir,opts:opts.map(o=>o.w)};
  }
  return {id,type:t};
}

function quiz(){
  const it=Q.items[Q.idx],w=BY[it.id],n=Q.items.length,ans=Q.answered,L=Q.last||{};
  const head=`<div class="top"><button class="icon-btn" data-a="leave-quiz" aria-label="그만두기">✕</button>
   <div class="bar"><i style="width:${Math.round((Q.idx+(ans?1:0))/n*100)}%"></i></div><div class="count">${Q.idx+1} / ${n}</div></div>`;
  let body='';
  if(it.type==='mc'){
    const ko=it.dir==='en2ko';
    body=`<div class="qprompt">${ko?'알맞은 뜻을 고르세요':'알맞은 단어를 고르세요'}</div>
     <div class="qmain ${ko?'':'ko'}">${ko?`${w.w}<div class="ipa" style="font-size:16px;font-weight:400">${w.ipa} · ${w.pos}</div>`:`${w.ko}<div class="muted small" style="font-weight:400">${w.pos}</div>`}</div>
     <div class="opts">${it.opts.map((o,i)=>{
       const ow=BY[o],txt=ko?ow.ko:ow.w;let c='';
       if(ans){if(o===w.w)c='right';else if(L.given===o)c='wrong';}
       return `<button class="opt ${c}" data-a="opt" data-o="${o}" ${ans?'disabled':''}><b>${i+1}</b><span style="${ko?'':'font-family:var(--font-latin);font-weight:700'}">${txt}</span></button>`;}).join('')}</div>`;
  }else{
    const target=targetOf(it,w);
    const cls=ans?(L.ok?'right':'wrong'):'';
    const prompts={cloze:'빈칸에 알맞은 형태로 쓰세요',short:'뜻에 맞는 영단어를 쓰세요',def:'다음 정의에 해당하는 용어를 쓰세요',dcloze:'정의의 빈칸에 알맞은 핵심어를 쓰세요'};
    const main={cloze:`<div class="qmain sent">${exBlank(w)}</div><div class="chip" style="align-self:flex-start">${w.pos} · ${w.ko}</div>`,
      short:`<div class="qmain ko">${w.ko}<div class="muted small" style="font-weight:400">${w.pos}</div></div>`,
      def:`<div class="qmain sent">${dfPlain(w)}</div>`,
      dcloze:`<div class="chip" style="align-self:flex-start">용어 · ${w.w}</div><div class="qmain sent">${dfBlank(w)}</div>`}[it.type];
    body=`<div class="qprompt">${prompts[it.type]}</div>${main}
     <input id="ans" class="inp ${cls}" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="영어로 입력" value="${ans?(L.given||'').replace(/"/g,'&quot;'):''}" ${ans?'disabled':''} aria-label="답 입력">
     <div class="hintline" id="hint">${Q.hint&&!ans?hintText(target):''}</div>
     ${ans?'':`<div class="row"><button class="btn" data-a="hint">힌트</button><button class="btn" data-a="skip">모르겠어요</button><button class="btn primary grow" data-a="submit">확인</button></div>`}`;
  }
  let fb='';
  if(ans){
    const ok=L.ok;
    fb=`<div class="fb ${ok?'ok':'bad'}"><div class="v">${ok?'정답입니다':'오답이에요'}${!ok&&it.type!=='mc'?` · 정답: ${targetOf(it,w)}`:''}</div>
      <div><b style="font-family:var(--font-latin);font-size:18px">${w.w}</b> <span class="ipa" style="font-size:15px">${w.ipa}</span> <button class="icon-btn" style="width:34px;height:34px;font-size:14px;display:inline-grid;vertical-align:middle" data-a="speak" data-w="${w.w}" aria-label="발음 듣기">🔊</button></div>
      <div><b>${w.pos}</b> ${w.ko}</div>${w.df?`<div class="df">${dfHtml(w)}</div>`:''}${w.ex?`<div class="ex">${exHtml(w)}</div>`:''}
      ${!ok&&Q.mode==='daily'?'<div class="small muted">오답노트에 저장했어요. 내일 다시 복습해요.</div>':''}
      ${!ok&&Q.mode==='review'?'<div class="small muted">복습 간격이 1일로 돌아가요.</div>':''}
      ${ok&&Q.mode==='review'?'<div class="small muted">다음 단계로 올라갔어요.</div>':''}</div>
      <button class="btn primary block" data-a="next-q" id="nextq">${Q.idx===n-1?'결과 보기':'다음 문제'}</button>`;
  }
  return `${head}<div class="card q">${body}</div>${fb}`;
}
const hintText=t=>t[0]+' '+t.slice(1).replace(/[A-Za-z]/g,'_').split('').join(' ').replace(/  +/g,'   ')+'  ('+t.length+'자)';

function result(){
  const r=RES,n=r.res.length,ok=r.res.filter(x=>x.ok).length,pct=n?Math.round(ok/n*100):0,wr=r.res.filter(x=>!x.ok);
  const C=2*Math.PI*62,off=C*(1-pct/100);
  const msg=pct===100?'만점입니다. 오늘 분량은 완벽해요.':pct>=80?'아주 잘했어요. 틀린 단어만 챙기면 됩니다.':pct>=50?'절반 이상 맞혔어요. 오답노트가 다음 복습에서 도와줄 거예요.':'어려웠죠. 괜찮아요, 틀린 단어는 자동으로 반복 복습돼요.';
  return `
  <div class="card col" style="align-items:center;text-align:center">
   <div class="ring"><svg viewBox="0 0 150 150"><circle class="tr" cx="75" cy="75" r="62" fill="none" stroke-width="14"/><circle class="pr" cx="75" cy="75" r="62" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><div>${ok}/${n}</div></div>
   <h2 class="disp" style="font-size:24px">${pct}점</h2><p class="muted">${msg}</p>
   ${r.mode==='daily'?`<span class="chip ok">오늘 출석 완료 · 연속 ${streak()}일</span>`:''}
  </div>
  ${wr.length?`<div class="card"><h3 class="disp" style="font-size:20px;margin-bottom:6px">틀린 단어 ${wr.length}개</h3><div class="wlist">${wr.map(x=>`<div><b>${x.id}</b><span class="muted">${BY[x.id].ko}</span></div>`).join('')}</div></div>`:''}
  ${wr.length?`<button class="btn primary block" data-a="retry-wrong">틀린 문제 바로 다시 풀기</button>`:''}
  <button class="btn block" data-a="back-home">홈으로</button>`;
}

function badges(){
  const lc=learnedCount(),b=bestStreak(),perfect=S.perfect||Object.keys(S.att).some(k=>S.att[k].qtot>0&&S.att[k].qok===S.att[k].qtot),mc=Object.keys(S.master).length;
  return [['첫 출석','1',Object.keys(S.att).length>=1],['3일 연속','3',b>=3],['7일 연속','7',b>=7],['30일 연속','30',b>=30],
   ['100단어','100',lc>=100],['300단어','300',lc>=300],['전체 완료','★',lc>=WORDS.length],['퀴즈 만점','100',perfect],['오답 졸업 10','10',mc>=10]];
}

let DQ={q:'',cat:'all',st:'all',lim:60};
function wstat(id){return S.wrong[id]?'w':S.master[id]?'m':S.learned[id]?'l':'n';}
function dictMatch(){
  const q=DQ.q.trim().toLowerCase();
  return WORDS.filter(w=>{
    if(DQ.cat!=='all'&&w.cat!==DQ.cat)return false;
    const st=wstat(w.w);
    if(DQ.st==='new'&&st!=='n')return false;
    if(DQ.st==='learned'&&st==='n')return false;
    if(DQ.st==='wrong'&&st!=='w')return false;
    if(DQ.st==='mark'&&!S.marks[w.w])return false;
    if(q&&!(w.w.toLowerCase().includes(q)||(w.ko||'').includes(q)||(w.df||'').toLowerCase().includes(q)))return false;
    return true;
  });
}
function dictRow(w){
  const st=wstat(w.w);
  return `<details data-w="${w.w}"><summary><span class="col" style="gap:4px"><b><i class="st-dot ${st==='n'?'':st}"></i>${w.w}</b><span class="muted small">${w.ko}</span></span><span class="chip">${CATS[w.cat]}</span></summary>
   <div class="dbody"><div class="ipa">${w.ipa} · ${w.pos}</div>${w.df?`<div class="df">${dfHtml(w)}</div>`:''}${w.ex?`<div class="ex">${exHtml(w)}</div>`:''}
   <div class="row"><button class="btn" data-a="speak" data-w="${w.w}">🔊 발음</button><button class="btn" data-a="bm" data-w="${w.w}">${S.marks[w.w]?'★ 북마크됨':'☆ 북마크'}</button></div></div></details>`;
}
function dictList(){
  const m=dictMatch(),shown=m.slice(0,DQ.lim);
  return `<div class="muted small" style="padding:10px 0 4px">${m.length}개${m.length>shown.length?` 중 ${shown.length}개 표시`:''}</div>`+
    (shown.length?shown.map(dictRow).join(''):'<p class="muted" style="padding:8px 0">검색 결과가 없어요.</p>')+
    (m.length>shown.length?'<button class="btn block" data-a="dict-more" style="margin:10px 0">더 보기</button>':'');
}
function dict(){
  const cats=Object.keys(CATS).filter(c=>WORDS.some(w=>w.cat===c));
  const sts=[['all','전체'],['new','새 단어'],['learned','학습함'],['wrong','오답'],['mark','★']];
  return `
  <div class="head"><h1>단어장</h1></div>
  <input class="search" id="dq" type="search" placeholder="영단어·뜻·정의 검색" value="${DQ.q.replace(/"/g,'&quot;')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="단어 검색">
  <div class="fchips" id="dcat">${[['all','전체 분야']].concat(cats.map(c=>[c,CATS[c]])).map(c=>`<button class="${DQ.cat===c[0]?'on':''}" data-a="dcat" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="fchips" id="dst">${sts.map(c=>`<button class="${DQ.st===c[0]?'on':''}" data-a="dst" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="card" style="padding:4px 16px" id="dlist">${dictList()}</div>`;
}
function dictRefresh(){
  document.getElementById('dlist').innerHTML=dictList();
  document.querySelectorAll('#dcat button').forEach(b=>b.classList.toggle('on',b.dataset.v===DQ.cat));
  document.querySelectorAll('#dst button').forEach(b=>b.classList.toggle('on',b.dataset.v===DQ.st));
}

function stats(){
  const keys=Object.keys(S.att),lc=learnedCount(),acc=S.stats.answered?Math.round(S.stats.correct/S.stats.answered*100):0;
  const first=new Date(calY,calM,1),days=new Date(calY,calM+1,0).getDate(),td=TODAY();
  let cells='';for(let i=0;i<first.getDay();i++)cells+='<button class="e" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1;d<=days;d++){const k=calY+'-'+z(calM+1)+'-'+z(d),a=S.att[k];

  const catBars=Object.keys(CATS).map(c=>{const tot=WORDS.filter(w=>w.cat===c).length,l=WORDS.filter(w=>w.cat===c&&S.learned[w.w]).length;

  const cs=S.stats.cat||{};
  const accRows=Object.keys(CATS).filter(c=>cs[c]&&cs[c].a>=5).map(c=>({c,a:cs[c].a,p:Math.round(cs[c].c/cs[c].a*100)})).sort((x,y)=>x.p-y.p);
  const worst=Object.keys(S.wrong).filter(k=>BY[k]).sort((a,b)=>S.wrong[b].miss-S.wrong[a].miss).slice(0,5);

   ${accRows.length?accRows.map((r,i)=>`<div class="pbar"><div class="row between small"><span>${CATS[r.c]}${i===0&&accRows.length>1?' · 가장 약해요':''}</span><b>${r.p}% <span class="muted">(${r.a}문제)</span></b></div><div class="bar ${r.p>=80?'ok':''}"><i style="width:${r.p}%"></i></div></div>`).join(''):'<p class="muted small">분야별로 5문제 이상 풀면 정답률이 나와요.</p>'}
   ${worst.length?`<div class="lbl" style="margin-top:6px">자주 틀리는 단어</div>${worst.map(id=>`<div class="wk"><b>${id}</b><span class="muted">${BY[id].ko} · ${S.wrong[id].miss}회</span></div>`).join('')}`:''}</div>`;
  return `
  <div class="head"><h1>기록</h1></div>

   <div class="cal">${'일월화수목금토'.split('').map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
   <div class="row small muted"><span class="chip">학습</span><span class="chip" style="background:var(--sea);color:#fff">학습+퀴즈</span></div>${sel}</div>
  <div class="card col"><h2 class="disp" style="font-size:22px">분야별 진도</h2>${catBars}</div>

}

function settings(){
  const s=S.set,types=[['mc','객관식'],['short','단답형'],['cloze','예문 빈칸'],['def','정의→용어'],['dcloze','정의 빈칸']];
  return `
  <div class="top"><button class="icon-btn" data-a="back-home" aria-label="뒤로">‹</button><h1 class="disp" style="font-size:24px">설정</h1></div>
  <div class="card col"><label class="lbl">하루 학습 단어 수</label>
   <div class="stepper"><button class="icon-btn" data-a="daily" data-n="-5" aria-label="5개 줄이기">−</button><div class="v">${s.daily}</div><button class="icon-btn" data-a="daily" data-n="5" aria-label="5개 늘리기">+</button><span class="muted">개 / 일</span></div>
   <div class="toggle">${[10,20,30,50,100,200].map(n=>`<button class="${s.daily===n?'on':''}" data-a="daily-set" data-n="${n}">${n}</button>`).join('')}</div>
   <p class="muted small">오늘 카드 학습을 마치기 전이면 바로 적용돼요. 마친 뒤에는 내일부터 적용돼요. 전체 ${WORDS.length}단어 기준 약 ${Math.ceil(WORDS.length/s.daily)}일이면 한 바퀴예요.</p></div>
  <div class="card col"><label class="lbl">학습 분야</label>
   <div class="toggle">${Object.keys(CATS).filter(c=>WORDS.some(w=>w.cat===c)).map(c=>`<button class="${s.cats.includes(c)?'on':''}" data-a="toggle-cat" data-c="${c}" aria-pressed="${s.cats.includes(c)}">${CATS[c]}</button>`).join('')}</div></div>
  ${syncCard()}
  <div class="card col"><label class="lbl">발음</label>
   <div class="toggle"><button class="${s.auto?'on':''}" data-a="auto-toggle" aria-pressed="${!!s.auto}">카드가 나오면 자동으로 읽어주기</button></div></div>
  <div class="card col"><label class="lbl">기본 퀴즈 유형</label>
   <div class="toggle">${types.map(t=>`<button class="${s.types.includes(t[0])?'on':''}" data-a="toggle-type" data-t="${t[0]}" data-stay="1" aria-pressed="${s.types.includes(t[0])}">${t[1]}</button>`).join('')}</div></div>
  <div class="card col"><label class="lbl" for="imp">내 단어 추가 (${S.custom.length}개 등록됨)</label>
   <p class="muted small">한 줄에 한 단어. 칸은 | 로 나누세요. 발음기호·품사·예문은 비워도 돼요. 예문에서 빈칸이 될 부분은 {중괄호}로 감싸면 빈칸 문제로도 나와요.</p>
   <textarea id="imp" placeholder="resilient | /rɪˈzɪliənt/ | adj. | 회복력 있는 | {Resilient} learners bounce back."></textarea>
   <button class="btn" data-a="import">단어 추가하기</button>
   ${S.custom.length?'<button class="btn" data-a="clear-custom">내 단어 모두 삭제</button>':''}</div>
  <div class="card col"><label class="lbl" for="exam">시험일 (D-day 표시)</label><input type="date" id="exam" value="${s.exam||''}"></div>
  <div class="card col"><label class="lbl">데이터 백업</label>
   <p class="muted small">기록은 이 브라우저에 저장돼요. 기기를 바꿀 때는 복사해서 옮기세요.${canStore?'':' (현재 저장소를 쓸 수 없어 이 화면을 닫으면 기록이 사라져요)'}</p>
   <button class="btn" data-a="backup">백업 데이터 복사</button>
   <textarea id="bk" placeholder="여기에 백업 데이터를 붙여넣고 복원을 누르세요"></textarea>
   <button class="btn" data-a="restore">복원하기</button>
   <button class="btn ${resetArm?'bad':''}" data-a="reset">${resetArm?'정말 모든 기록 삭제':'기록 초기화'}</button></div>`;
}

function render(){
  const f={home,study,qsetup,quiz,result,review,dict,stats,settings}[view];
  app.innerHTML=f();
  const nav=document.getElementById('nav'),show=['home','review','dict','stats'].includes(view);
  nav.hidden=!show;
  if(show){
    const due=dueList().length;
    const I={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',review:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>',dict:'<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 4v16M12 9h4"/>',stats:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'};
    nav.innerHTML='<div class="in">'+[['home','홈'],['review','복습'],['dict','단어장'],['stats','기록']].map(t=>`<button class="${view===t[0]?'on':''}" data-a="nav" data-v="${t[0]}" ${view===t[0]?'aria-current="page"':''}><svg viewBox="0 0 24 24">${I[t[0]]}</svg>${t[1]}${t[0]==='review'&&due?`<span class="pill">${due}</span>`:''}</button>`).join('')+'</div>';
  }
  if(view==='study'&&S.set.auto&&ST.autoIdx!==ST.idx+':'+ST.src){ST.autoIdx=ST.idx+':'+ST.src;setTimeout(()=>speak(ST.ids[ST.idx]),150);}
  if(view==='quiz'){
    if(Q.answered){const e=document.getElementById('nextq');if(e){e.scrollIntoView({block:'nearest'});}}
    else{const i=document.getElementById('ans');if(i)setTimeout(()=>i.focus({preventScroll:true}),30);}
  }
}

/* ===================== ACTIONS ===================== */
function startCards(ids,src){ST={ids,idx:0,src,hide:false,rev:false};go('study');}
function openQuiz(ids,mode){PEND={ids:shuffle(ids),mode};go('qsetup');}
function finishCards(){
  if(ST.src==='today'){
    const t=S.today,before=stageOf(learnedCount());t.studyDone=true;t.idx=0;t.ids.forEach(id=>S.learned[id]=TODAY());A().words+=t.ids.length;save();
    const after=stageOf(learnedCount());
    toast(after>before?`코끼리가 자랐어요! ${LV[after-1]}`:'카드 학습 완료! 출석 체크됐어요');openQuiz(t.ids,'daily');
  }else{A().rev++;save();toast('카드 복습 완료');go(ST.src==='review'?'review':'review');}
}
function applyEffect(id,ok){
  const td=TODAY();
  if(Q.mode==='daily'){
    if(!ok){const o=S.wrong[id];S.wrong[id]={box:0,due:addDays(td,1),miss:(o?o.miss:0)+1};delete S.master[id];}
  }else if(Q.mode==='review'){
    const o=S.wrong[id];if(!o)return;
    if(ok){const b=o.box+1;if(b>=INT.length){delete S.wrong[id];S.master[id]=td;}else S.wrong[id]={box:b,due:addDays(td,INT[b]),miss:o.miss};}
    else S.wrong[id]={box:0,due:addDays(td,1),miss:o.miss+1};
  }
}
function answer(ok,given){
  Q.answered=true;Q.last={ok,given};Q.res.push({id:Q.items[Q.idx].id,ok});
  S.stats.answered++;if(ok)S.stats.correct++;
  {const c=BY[Q.items[Q.idx].id].cat;const cs=S.stats.cat||(S.stats.cat={});const o=cs[c]||(cs[c]={a:0,c:0});o.a++;if(ok)o.c++;}
  const a=A();a.qtot++;if(ok)a.qok++;
  applyEffect(Q.items[Q.idx].id,ok);save();render();
}
function finishQuiz(){
  RES={mode:Q.mode,res:Q.res,ids:Q.res.filter(r=>!r.ok).map(r=>r.id)};
  if(Q.mode==='daily'){S.today.quizDone=true;}
  if(Q.mode==='review')A().rev++;
  save();go('result');
}
function checkInput(){
  const it=Q.items[Q.idx],w=BY[it.id],v=document.getElementById('ans').value;
  if(!norm(v)){toast('답을 입력해 주세요');return;}
  const target=targetOf(it,w);
  answer(norm(v)===norm(target),v.trim());
}

const H={
 nav:d=>{resetArm=false;go(d.v);},
 'back-home':()=>go('home'),
 'start-study':()=>{ensureToday();if(!S.today.ids.length)return;startCards(S.today.ids,'today');ST.idx=Math.min(S.today.idx||0,S.today.ids.length-1);render();},
 'start-study-again':()=>startCards(S.today.ids,'again'),
 'start-daily-quiz':()=>openQuiz(S.today.ids,'daily'),
 'more-batch':()=>{const p=makePlan(S.today.batch+1);if(!p.ids.length){toast('남은 새 단어가 없어요');return;}S.today=p;save();go('home');toast('새 단어 '+p.ids.length+'개를 준비했어요');},
 'start-review':()=>openQuiz(dueList(),'review'),
 'review-cards':()=>startCards(dueList(),'review'),
 rv:d=>{rv=d.v;render();},
 'list-quiz':()=>{const ids=rv==='wrong'?Object.keys(S.wrong):Object.keys(S.marks);openQuiz(ids.filter(k=>BY[k]),'practice');},
 'list-cards':()=>{const ids=rv==='wrong'?Object.keys(S.wrong):Object.keys(S.marks);startCards(ids.filter(k=>BY[k]),'list');},
 'next-card':()=>{if(ST.idx>=ST.ids.length-1){finishCards();return;}ST.idx++;ST.rev=false;if(ST.src==='today'){S.today.idx=ST.idx;save();}render();window.scrollTo(0,0);},
 'prev-card':()=>{if(ST.idx>0){ST.idx--;ST.rev=false;render();}},
 fuzzy:()=>{S.marks[ST.ids[ST.idx]]=TODAY();save();H['next-card']();},
 bm:d=>{if(S.marks[d.w])delete S.marks[d.w];else S.marks[d.w]=TODAY();save();
  if(view==='dict'){document.querySelectorAll(`#dlist [data-a="bm"][data-w="${CSS.escape(d.w)}"]`).forEach(b=>b.textContent=S.marks[d.w]?'★ 북마크됨':'☆ 북마크');if(DQ.st==='mark')dictRefresh();}else render();},
 dcat:d=>{DQ.cat=d.v;DQ.lim=60;dictRefresh();},
 dst:d=>{DQ.st=d.v;DQ.lim=60;dictRefresh();},
 'dict-more':()=>{DQ.lim+=60;dictRefresh();},
 'fb-save':()=>{const c=parseFbConfig(document.getElementById('fbcfg').value);if(!c){toast('apiKey, projectId, appId가 들어 있는 설정을 붙여넣어 주세요');return;}try{localStorage.setItem(FBKEY,JSON.stringify(c));}catch(e){}location.reload();},
 'fb-clear':()=>{try{localStorage.removeItem(FBKEY);}catch(e){}location.reload();},
 'fb-in':()=>fbAuth('in'),
 'fb-up':()=>fbAuth('up'),
 'fb-logout':async()=>{try{await FB.lib.auth.signOut(FB.auth);toast('로그아웃했어요');}catch(e){}},
 'sync-now':async()=>{if(!SYNC.on){toast('동기화를 쓸 수 없는 상태예요');return;}toast('동기화 중…');try{const ch=await syncPull();await syncPush();SYNC.last=Date.now();if(ch)ensureToday();render();toast(ch?'다른 기기의 기록을 불러왔어요':'동기화 완료');}catch(e){SYNC.status='err';render();toast('동기화에 실패했어요');}},
 'auto-toggle':()=>{S.set.auto=!S.set.auto;save();render();},
 speak:d=>speak(d.w),
 reveal:()=>{ST.rev=true;render();},
 'toggle-hide':()=>{ST.hide=!ST.hide;ST.rev=false;render();},
 'leave-study':()=>{go(ST.src==='today'||ST.src==='again'?'home':'review');},
 'toggle-type':d=>{const t=S.set.types,i=t.indexOf(d.t);if(i>=0){if(t.length>1)t.splice(i,1);else toast('유형은 하나 이상 선택해야 해요');}else t.push(d.t);save();render();},
 'start-quiz':()=>{
   Q={mode:PEND.mode,items:PEND.ids.map(id=>buildQ(id,S.set.types)),idx:0,answered:false,last:null,res:[],hint:false};go('quiz');},
 opt:d=>{if(Q.answered)return;answer(d.o===Q.items[Q.idx].id,d.o);},
 submit:()=>{if(!Q.answered)checkInput();},
 hint:()=>{const it=Q.items[Q.idx],w=BY[it.id];Q.hint=true;document.getElementById('hint').textContent=hintText(targetOf(it,w));},
 skip:()=>{if(!Q.answered)answer(false,'');},
 'next-q':()=>{if(Q.idx>=Q.items.length-1){finishQuiz();return;}Q.idx++;Q.answered=false;Q.last=null;Q.hint=false;render();window.scrollTo(0,0);},
 'leave-quiz':()=>{go('home');toast('진행한 결과까지만 저장됐어요');},
 'retry-wrong':()=>openQuiz(RES.ids,'retry'),
 'cal-prev':()=>{calM--;if(calM<0){calM=11;calY--;}render();},
 'cal-next':()=>{calM++;if(calM>11){calM=0;calY++;}render();},
 'cal-day':d=>{calSel=d.d;render();},
 daily:d=>{setDaily(S.set.daily+Number(d.n));},
 'daily-set':d=>setDaily(Number(d.n)),
 import:()=>{
   const lines=document.getElementById('imp').value.split('\n').map(x=>x.trim()).filter(Boolean);let added=0,skip=0;
   lines.forEach(l=>{const p=l.split('|').map(x=>x.trim());if(!p[0]||!p[3]){skip++;return;}
     if(BY[p[0]]&&BY[p[0]].cat!=='my'){skip++;return;}
     if(S.custom.some(c=>c.w===p[0])){skip++;return;}
     S.custom.push({w:p[0],ipa:p[1]||'',pos:p[2]||'',ko:p[3],ex:p[4]||''});added++;});
   applyCustom();if(added&&!S.set.cats.includes('my'))S.set.cats.push('my');
   if(added)replan();save();render();toast(added?`${added}개 추가했어요`+(skip?` (${skip}줄 건너뜀)`:''):'형식을 확인해 주세요: 단어 | 발음 | 품사 | 뜻 | 예문');},
 'clear-custom':()=>{S.custom=[];applyCustom();S.set.cats=S.set.cats.filter(c=>c!=='my');if(!S.set.cats.length)S.set.cats=CAT_DEFAULT.slice();Object.keys(S.learned).forEach(k=>{if(!BY[k])delete S.learned[k];});replan();save();render();toast('삭제했어요');},
 'toggle-cat':d=>{const c=S.set.cats,i=c.indexOf(d.c);if(i>=0){if(c.length>1)c.splice(i,1);else toast('분야는 하나 이상 선택해야 해요');}else c.push(d.c);replan();save();render();},
 backup:()=>{const txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(()=>toast('백업 데이터를 복사했어요'),()=>fallbackBackup(txt));}catch(e){fallbackBackup(txt);}},
 restore:()=>{const v=document.getElementById('bk').value.trim();try{const p=JSON.parse(v);if(!p||!p.set||!p.att)throw 0;S=migrate(p);S.epoch=Date.now();applyCustom();save();toast('복원했어요');go('home');}catch(e){toast('백업 데이터 형식이 올바르지 않아요');}},
 reset:()=>{if(!resetArm){resetArm=true;render();return;}resetArm=false;S=fresh();S.epoch=Date.now();save();toast('초기화했어요');go('home');}
};
function fallbackBackup(txt){const t=document.getElementById('bk');if(t){t.value=txt;t.select();toast('아래 상자의 내용을 직접 복사해 주세요');}}
function setDaily(n){S.set.daily=Math.max(5,Math.min(200,n));replan();save();render();}
function replan(){if(S.today&&!S.today.studyDone&&S.today.date===TODAY()){S.today=makePlan(S.today.batch);}}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a)return;
  const f=H[a.dataset.a];if(f)f(a.dataset,e);
});
document.addEventListener('change',e=>{if(e.target.id==='exam'){S.set.exam=e.target.value;save();toast(e.target.value?'시험일을 저장했어요':'시험일을 지웠어요');}});
document.addEventListener('input',e=>{if(e.target.id==='dq'){DQ.q=e.target.value;DQ.lim=60;dictRefresh();}});
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{if(view!=='study'||e.touches.length!==1)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if(view!=='study'||tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8){if(dx<0)H['next-card']();else H['prev-card']();}
},{passive:true});
document.addEventListener('keydown',e=>{
  if(view==='study'&&!/INPUT|TEXTAREA/.test((e.target.tagName||''))){
    if(e.key==='ArrowRight'){H['next-card']();}
    else if(e.key==='ArrowLeft'){H['prev-card']();}
    else if(e.key===' '){e.preventDefault();if(ST.hide&&!ST.rev)H.reveal();else H['next-card']();}
    else if(e.key==='s'||e.key==='S'){speak(ST.ids[ST.idx]);}
    else if(e.key==='b'||e.key==='B'){H.bm({w:ST.ids[ST.idx]});}
    return;
  }
  if(view!=='quiz'||e.key!=='Enter')return;
  if(Q.answered){e.preventDefault();H['next-q']();}
  else if(e.target.id==='ans'){e.preventDefault();checkInput();}
});

ensureToday();render();syncInit();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
